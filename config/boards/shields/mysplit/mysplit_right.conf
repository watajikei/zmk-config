# NOTE: ZMK only merges a .conf whose name exactly matches the shield
# name, so shared settings must be duplicated here and in
# mysplit_left.conf - a "mysplit.conf" is silently ignored.

# Persistent storage for BLE bonds/keys - see mysplit_left.conf for the
# full explanation. The peripheral needs this too, to remember its bond
# to the central across reboots.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Save battery by sleeping when idle
CONFIG_ZMK_SLEEP=y

# Enable battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
