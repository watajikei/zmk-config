# NOTE: ZMK only merges a .conf whose name exactly matches the shield
# name, so shared settings must be duplicated here and in
# mysplit_right.conf - a "mysplit.conf" is silently ignored.

# Persistent storage for BLE bonds/keys.
#
# xiao_ble's board definition lives in the Zephyr tree, not ZMK's, so it
# ships without the flash/NVS config that ZMK's own boards (e.g.
# nice_nano_v2) set. Without these, CONFIG_SETTINGS_NONE is selected and
# every bond save fails with -ENOENT ("Failed to save keys (err -2)").
# The host then can't re-encrypt on reconnect and terminates the link
# itself, which showed up as endless connect/disconnect cycling.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# NVS uses the SoC's internal flash (CONFIG_SOC_FLASH_NRF), so the
# external QSPI flash driver is dead weight - leaving it on keeps the
# nRF QSPI peripheral running and drains the coin cell. The DT nodes are
# disabled in mysplit.dtsi; this makes sure the driver isn't built at all.
CONFIG_NORDIC_QSPI_NOR=n

# Save battery by sleeping when idle. Dropped from the default 15min to
# 5min: measured ~8 days on a CR2032, and the central drains far faster
# than the peripheral (2.80V vs 2.93V after the same 8 days), which
# points at BLE airtime rather than a fixed hardware draw.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Ask the host for a slower connection interval. ZMK's default of
# 7.5-15ms means the radio wakes ~67x/sec; 30-50ms cuts that to 20-33.
# The latency preference (30) is already requested but Windows granted
# 0, so the interval is the only lever that actually takes effect here.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40

# Enable battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
