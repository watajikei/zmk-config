# NOTE: ZMK only merges a .conf whose name exactly matches the shield
# name, so shared settings must be duplicated here and in
# mysplit_right.conf - a "mysplit.conf" is silently ignored.

# Persistent storage for BLE bonds/keys.
#
# xiao_ble's board definition lives in the Zephyr tree, not ZMK's, so it
# ships without the flash/NVS config that ZMK's own boards (e.g.
# nice_nano_v2) set. Without these, CONFIG_SETTINGS_NONE is selected and
# every bond save fails with -ENOENT ("Failed to save keys (err -2)").
# The host then can't re-encrypt on reconnect and terminates the link
# itself, which showed up as endless connect/disconnect cycling.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Save battery by sleeping when idle
CONFIG_ZMK_SLEEP=y

# Enable battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
